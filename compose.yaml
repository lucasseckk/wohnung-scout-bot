services:
  wohnung-bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - ./config/profile.json:/app/config/profile.json:ro
      - ./data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
